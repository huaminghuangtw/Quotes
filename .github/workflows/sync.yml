name: sync

on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsS https://huam.ing/quotes.json -o quotes.json
      - run: |
          git config user.name  github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "sync $(date -u +%F)" || exit 0
          git push
